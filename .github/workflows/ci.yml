name: CI

# The suite runs on the three operating systems a user is likely to install on,
# and on the lowest Node the package declares plus the current LTS. Windows is
# here for one reason above the rest: it checks out with CRLF line endings, and
# the evidence digest hashes the bytes of the working tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.19", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The end-to-end tests build repositories and commit into them, and git
      # refuses to commit without an identity.
      - name: Give git an identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm ci

      - run: npm run build

      - run: npm test
